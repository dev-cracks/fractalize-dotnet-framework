# Keeps dependencies up to date with weekly, grouped pull requests.
# Commit messages follow Conventional Commits: "build(deps): ..." / "ci(deps): ...".
# Major versions of libraries are upgraded deliberately by a maintainer, so version
# updates ignore them; Dependabot security alerts still report every vulnerability.
# GitHub Actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment.
#
# Add one entry per toolchain of the project. Examples (uncomment and adjust "directory"):
#   nuget | pip | gomod | npm | maven | gradle | docker | terraform | cargo | composer
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: ci, include: scope }
    groups:
      actions:
        patterns: ["*"]

  # - package-ecosystem: npm
  #   directory: /
  #   schedule: { interval: weekly, day: monday }
  #   open-pull-requests-limit: 5
  #   ignore:
  #     - dependency-name: "*"
  #       update-types: [version-update:semver-major]
  #   commit-message: { prefix: build, include: scope }
  #   groups:
  #     npm:
  #       patterns: ["*"]
  #       update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message: { prefix: build, include: scope }
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
