name: CI

# Quality gates for every pull request and for main: repository-wide checks inherited from
# danielfyo/public-repo-template plus the .NET build and test job of this project.
# Every job id must be a required check of the "Protect main" ruleset (scripts/setup-repo.ps1).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      - name: Relative links point to existing files
        run: python3 tools/check_links.py

  editorconfig:
    name: editorconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
      - run: editorconfig-checker

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  powershell:
    name: powershell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse and lint PowerShell scripts
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Recurse -Include *.ps1, *.psm1 -File | Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' })
          if ($files.Count -eq 0) { Write-Host 'No PowerShell files.'; exit 0 }
          $failed = $false
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $issues = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost)
          foreach ($i in $issues) { Write-Host "::error file=$($i.ScriptPath),line=$($i.Line)::$($i.RuleName): $($i.Message)" }
          if ($failed -or $issues.Count -gt 0) { exit 1 }

  # --- Project jobs ----------------------------------------------------------

  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      SOLUTION: src/Efc.Fractalize.Framework.sln
      # Minimum line coverage. Target: 80 (docs/engineering-standards.md); only ever raise it.
      COVERAGE_MIN: "80"
      # Minimum line coverage of the DDD core (Efc.Fractalize.Ddd) measured with its own tests.
      DDD_COVERAGE_MIN: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The libraries target net10.0.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
      - run: dotnet restore "$SOLUTION"
      - run: dotnet build "$SOLUTION" --no-restore -c Release -warnaserror
      - run: >-
          dotnet test "$SOLUTION" --no-build -c Release
          --collect "XPlat Code Coverage" --settings coverlet.runsettings
          --logger trx --results-directory TestResults
      - name: Line coverage is at least COVERAGE_MIN
        run: python3 tools/check_coverage.py TestResults --min "$COVERAGE_MIN"
      # The DDD core must keep at least 90 % line coverage on its own (ADR 0094, Q23), measuring only
      # Efc.Fractalize.Ddd and excluding no attribute (coverlet.ddd.runsettings).
      - name: Line coverage of Efc.Fractalize.Ddd is at least DDD_COVERAGE_MIN
        run: >-
          dotnet test src/Tests/Efc.Fractalize.Ddd.Tests --no-build -c Release
          --collect "XPlat Code Coverage" --settings coverlet.ddd.runsettings
          --results-directory TestResults/ddd
          && python3 tools/check_coverage.py TestResults/ddd --min "$DDD_COVERAGE_MIN"
      # Nothing in the DDD core may hide from that gate. Checked on the result: every source file with code
      # in the package PDB must be in the coverage report (an attribute named ExcludeFrom*Coverage, of any
      # namespace, makes coverlet drop it)...
      - name: Every source file of Efc.Fractalize.Ddd is in its coverage report
        run: >-
          DDD_COVERAGE_REPORT="$PWD/TestResults/ddd"
          dotnet test src/Tests/Efc.Fractalize.Architecture.Tests --no-build -c Release
          --filter "FullyQualifiedName~DddCoverageCompletenessTest"
      # ...and on the source: no exclusion, generated-code or obsolete attribute, nor an alias that hides one.
      - name: No coverage-hiding attributes in Efc.Fractalize.Ddd
        run: |
          found="$(grep -rnE 'ExcludeFrom[A-Za-z0-9_]*Coverage|GeneratedCode|CompilerGenerated|Obsolete|using +[A-Za-z0-9_]+ *= *.*Attribute' \
            --include='*.cs' --exclude-dir=obj --exclude-dir=bin src/Efc.Fractalize.Ddd || true)"
          if [ -n "$found" ]; then
            echo "::error::Efc.Fractalize.Ddd must not hide code from coverage:"
            echo "$found"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: TestResults
          retention-days: 7
