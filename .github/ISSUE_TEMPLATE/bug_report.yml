name: Bug report
description: Something does not work as documented.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What is wrong?
      description: Include file paths, the command you ran and its output if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.2.3 or a commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime and tool versions.
